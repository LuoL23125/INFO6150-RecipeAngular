<div class="container mt-5">
  <div class="form-signin shadow p-4 rounded bg-white">
    <h2 class="h3 mb-3 fw-normal text-center">Please sign in</h2>

    @if (errorMessage) {
      <div class="alert alert-danger">{{ errorMessage }}</div>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="form-floating mb-3">
        <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com" [(ngModel)]="email" name="email" required>
        <label for="floatingInput">Email address</label>
      </div>
      <div class="form-floating mb-3">
        <input type="password" class="form-control" id="floatingPassword" placeholder="Password" [(ngModel)]="password" name="password" required>
        <label for="floatingPassword">Password</label>
      </div>

      <button class="w-100 btn btn-lg custom-green-btn" type="submit">Sign in</button>
      
      <div class="text-center mt-3">
        <p>Don't have an account? <a routerLink="/register" class="text-success">Register</a></p>
      </div>
    </form>
  </div>
</div>
