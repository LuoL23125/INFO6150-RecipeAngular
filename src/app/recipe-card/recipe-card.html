<div class="card h-100 border-0 shadow-sm recipe-card">
  
  <div class="position-relative">
    @if (isHero) {
      <span class="badge bg-success position-absolute top-0 start-0 m-3 py-2 px-3 rounded-pill">
        Recipe of the Day
      </span>
    }
    
    <img [src]="recipe.image" class="card-img-top" [alt]="recipe.title">
  </div>
  
  <div class="card-body d-flex flex-column">
    <h3 class="card-title fw-bold mb-3" [ngClass]="{'fs-2': isHero, 'fs-4': !isHero}">
      {{ recipe.title }}
    </h3>
    
    <div class="card-text text-muted mb-4 summary-text" [innerHTML]="recipe.summary || recipe.description"></div>
    
    <div class="d-flex gap-4 mb-4 text-secondary small fw-bold">
      <div class="d-flex align-items-center">
        <i class="bi bi-clock me-2 fs-5"></i> 
        <span>{{ recipe.readyInMinutes || 'N/A' }} min</span>
      </div>
      <div class="d-flex align-items-center">
        <i class="bi bi-people me-2 fs-5"></i> 
        <span>{{ recipe.servings || 'N/A' }} servings</span>
      </div>
    </div>
    
    <div class="mt-auto pt-3 border-top d-flex align-items-center justify-content-between">
      
      <a [routerLink]="detailLink" class="btn btn-link text-success text-decoration-none p-0 fw-bold d-flex align-items-center">
        <i class="bi bi-eye-fill me-2"></i> VIEW RECIPE
      </a>
      
      <div class="d-flex align-items-center gap-2">
        
        @if (isOwner) {
          <button class="btn btn-icon p-0 text-primary me-1" (click)="onEdit($event)" title="Edit">
            <i class="bi bi-pencil-square fs-5"></i>
          </button>
          <button class="btn btn-icon p-0 text-danger me-2" (click)="onDelete($event)" title="Delete">
            <i class="bi bi-trash fs-5"></i>
          </button>
          <div class="vr h-50 mx-1"></div>
        }

        <button 
          class="btn btn-icon p-0" 
          (click)="onFavoriteClick($event)"
          [class.text-danger]="isFavorite()" 
          [class.text-secondary]="!isFavorite()"
        >
          <i class="bi" [ngClass]="isFavorite() ? 'bi-heart-fill' : 'bi-heart'" style="font-size: 1.3rem;"></i>
        </button>
        
        <button class="btn btn-icon p-0 text-secondary">
          <i class="bi bi-share fs-5"></i>
        </button>
      </div>
    </div>
  </div>
</div>
