<div class="container-fluid p-0">
  <div class="admin-header py-5 mb-4">
    <div class="container">
      <h1 class="fw-bold"><i class="bi bi-speedometer2 me-2"></i> Admin Dashboard</h1>
      <p class="mb-0 opacity-75">Manage users and system settings</p>
    </div>
  </div>

  <div class="container mb-5">
    <h3 class="mb-4 text-secondary">User Management</h3>
    
    <div class="table-responsive bg-white">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th scope="col">ID</th>
            <th scope="col">Name</th>
            <th scope="col">Email</th>
            <th scope="col">Role</th>
            <th scope="col">Joined</th>
          </tr>
        </thead>
        <tbody>
          @for (user of users; track user.id) {
            <tr>
              <td><small class="text-muted">{{ user.id }}</small></td>
              <td class="fw-bold">{{ user.name }}</td>
              <td>{{ user.email }}</td>
              <td>
                @if (user.isAdmin) {
                  <span class="badge bg-danger">Admin</span>
                } @else {
                  <span class="badge bg-secondary">User</span>
                }
              </td>
              <td>{{ user.createdAt | date:'mediumDate' }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
